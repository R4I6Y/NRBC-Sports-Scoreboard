<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="overlay" data-role="overlay">
<div id="stage">
  <div id="bug">
    <div class="el bar" id="awayBar"></div>
    <div class="el bar" id="homeBar"></div>

    <div class="el name"  id="awayName"></div>
    <div class="el score" id="awayScore">0</div>
    <div class="el" id="period"></div>
    <div class="el" id="clock"></div>
    <div class="el score" id="homeScore">0</div>
    <div class="el name"  id="homeName"></div>

    <div class="el meta" id="awayMeta"><span id="awayFouls"></span><span class="dots" id="awayTo"></span></div>
    <div class="el meta" id="homeMeta"><span id="homeFouls"></span><span class="dots" id="homeTo"></span></div>

    <div class="el" id="shot"></div>

    <div class="el" id="spot">
      <div id="spotNum"></div>
      <div><div id="spotName"></div><div id="spotStat"></div></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
